name: 构建 Debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 仓库里提交了 local.properties 且 sdk.dir=/opt/android-sdk，会覆盖 CI 的 SDK 路径，必须改写
      # 仓库里误提交了 local.properties（写死 sdk.dir=/opt/android-sdk），必须移除，
      # 让 AGP 直接用 runner 的 ANDROID_HOME 定位 SDK
      - name: 修正 local.properties
        run: |
          rm -f local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | head -5
          chmod +x ./gradlew

      - name: 计算版本号
        id: meta
        run: |
          VERSION_NAME="1.0.0-dev-${GITHUB_SHA::7}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "🏷  versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      - name: 构建 Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PAPP_VERSION_NAME="${{ steps.meta.outputs.version_name }}" \
            -PAPP_VERSION_CODE="${{ steps.meta.outputs.version_code }}"

      - name: 整理产物
        run: |
          mkdir -p artifacts
          V="${{ steps.meta.outputs.version_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/mcp-server-$V-debug.apk"
          ls -lh artifacts

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-debug-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
