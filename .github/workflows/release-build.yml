name: 构建 Release APK 并发版

# 仅手动触发：Actions → 本工作流 → Run workflow
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag，留空则自动用 v + 当天日期（如 v26.09.29）；如需自定义必须以 v 开头"
        type: string
        required: false
      version_name:
        description: "versionName，留空则按构建日期生成（如 26.09.29）"
        type: string
        required: false
      version_code:
        description: "versionCode，留空则按构建日期生成（如 260929）；同一天重复发版可手动指定更大值"
        type: integer
        required: false
      minify:
        description: "是否开启代码混淆（需 proguard 规则齐全，谨慎）"
        type: boolean
        default: false
      prerelease:
        description: "是否标记为预发布版本"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 构建 Release APK 并发版
    runs-on: ubuntu-latest
    env:
      # 密钥别名为中文，强制 runner 与 JVM 使用 UTF-8，避免别名解析成乱码
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
      # 版本号按构建日期生成，固定北京时间，避免 UTC 跨日导致日期差一天
      TZ: Asia/Shanghai
      # 签名变量必须在 job 级声明，否则只有单个 step 可见，Gradle 读到的会是空值
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验输入
        run: |
          TAG="${{ inputs.release_tag }}"
          case "$TAG" in ""|v*) ;; *) echo "::error::release_tag 必须以 v 开头，当前为 $TAG"; exit 1;; esac
          if [ -n "$TAG" ] && git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG 已存在，请换一个版本号"; exit 1
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 仓库里误提交了 local.properties（写死 sdk.dir=/opt/android-sdk），必须移除，
      # 让 AGP 直接用 runner 的 ANDROID_HOME 定位 SDK
      - name: 修正 local.properties
        run: |
          rm -f local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | head -5
          chmod +x ./gradlew

      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "::error::缺少签名 Secrets（SIGNING_KEYSTORE_BASE64 / SIGNING_KEY_ALIAS），正式发版必须签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mcp-server.jks"
          KS="$RUNNER_TEMP/mcp-server.jks"
          # 校验别名确实存在于 keystore 中（中文别名主要防乱码）
          keytool -list -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            || { echo "::error::在 keystore 中找不到别名，检查 SIGNING_KEY_ALIAS 是否正确"; exit 1; }
          keytool -list -v -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | grep -E "Alias name|SHA256|Valid from" | sed 's/^/  /'
          echo "SIGNING_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "✅ 签名密钥校验通过"

      - name: 计算版本号（按构建日期）
        id: meta
        run: |
          VERSION_NAME="${{ inputs.version_name }}"
          [ -z "$VERSION_NAME" ] && VERSION_NAME=$(date +'%y.%m.%d')
          VERSION_CODE="${{ inputs.version_code }}"
          [ -z "$VERSION_CODE" ] && VERSION_CODE=$(date +'%y%m%d')
          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "🏷  $TAG  versionName=$VERSION_NAME  versionCode=$VERSION_CODE"

      - name: 构建 Release APK
        run: |
          MINIFY_FLAG=""
          [ "${{ inputs.minify }}" = "true" ] && MINIFY_FLAG="-PMINIFY=true"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace $MINIFY_FLAG \
            -PAPP_VERSION_NAME="${{ steps.meta.outputs.version_name }}" \
            -PAPP_VERSION_CODE="${{ steps.meta.outputs.version_code }}"

      - name: 校验 APK 已签名
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -20

      - name: 整理产物
        run: |
          mkdir -p artifacts
          V="${{ steps.meta.outputs.version_name }}"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/mcp-server-$V-release.apk"
          ls -lh artifacts

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-release-${{ steps.meta.outputs.version_name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 生成 Release Notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## 更新内容"
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' || echo '- 首次发布'
            echo ""
            echo ""
            echo "## APK"
            for f in artifacts/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1) — sha256 \`$(sha256sum "$f" | cut -c1-16)…\`"
            done
            echo ""
            echo "> versionName ${{ steps.meta.outputs.version_name }} · versionCode ${{ steps.meta.outputs.version_code }} · minSdk 26 · targetSdk 35"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 打 tag 并创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: mcp-server ${{ steps.meta.outputs.version_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.apk
          draft: false
          prerelease: ${{ inputs.prerelease }}
